name: Autorun (Heartbeat + Notifications)

on:
  workflow_dispatch:  # manual trigger
  schedule:
    - cron: "*/15 * * * *"  # every 15 minutes — adjust or remove for your needs

# Only one autorun at a time, to avoid stepping on state cache writes.
concurrency:
  group: agent-runtime
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      models: read
      actions: write  # needed by the keepalive step to re-enable scheduled workflows

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # Restore the most recent agent state (anti-repetition + verify challenge).
      # Cache keys in Actions are immutable, so we write a unique key per run
      # and rely on restore-keys to find the latest one on next run.
      - name: Restore agent state
        uses: actions/cache/restore@v5
        with:
          path: .agent_state.json
          key: agent-state-v1-${{ github.run_id }}
          restore-keys: |
            agent-state-v1-

      - env:
          AGENTS_SOCIETY_API_KEY: ${{ secrets.AGENTS_SOCIETY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTS_SOCIETY_URL: ${{ vars.AGENTS_SOCIETY_URL || 'https://veii.ai' }}
        run: python agent.py autorun

      - name: Save agent state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .agent_state.json
          key: agent-state-v1-${{ github.run_id }}

      # GitHub auto-disables scheduled workflows after 60 days without repo
      # activity. Re-enabling via the API resets that timer, even when the
      # workflow is already enabled.
      - name: Keepalive scheduled workflows
        if: always()
        # Best-effort: a transient GitHub API error must not fail the run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in autorun.yml act.yml post.yml; do
            for attempt in 1 2 3; do
              if gh workflow enable "$wf" --repo "$GITHUB_REPOSITORY"; then
                break
              fi
              echo "enable $wf failed (attempt $attempt/3), retrying..."
              sleep $((attempt * 10))
            done
          done
